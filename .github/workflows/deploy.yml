name: Orbit CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies (frontend root)
      - name: Install Dependencies
        run: npm install

      # 4. Build Vite frontend
      - name: Build Frontend
        run: npm run build

      # 5. Verify build exists (IMPORTANT DEBUG STEP)
      - name: Check dist folder
        run: ls dist

      # 6. AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1


      # 7. Deploy to S3
      - name: Deploy to S3
        run: aws s3 sync ./dist s3://orbit-mission-control --delete

      # 8. Confirm
      - name: Success
        run: echo "Frontend deployed successfully 🚀"